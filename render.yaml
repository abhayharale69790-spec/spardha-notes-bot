services:
  - type: web
    name: spardha-notes-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BOT_TOKEN
        value: "8880658335:AAFf6yjx9L0SsXKoY-ucCX8soq-s1LRPTNs"
      - key: MAIN_CHANNEL_ID
        value: "-1004297360223"
      - key: STAGING_CHANNEL_ID
        value: "-1004475827003"
      - key: BACKUP_CHANNEL_ID
        value: "-1004387550439"
      - key: ADMIN_USER_IDS
        value: "8691719772"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///data/study_platform.db"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "15"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
